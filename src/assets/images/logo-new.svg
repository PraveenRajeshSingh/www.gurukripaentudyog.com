<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Gurukripa Bricks Logo">
  <defs>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8460A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B2E05;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDD835;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(139,46,5,0.35)"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#brickGrad)" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Flame / fire element at top -->
  <path d="M60 22 C54 30 50 36 54 42 C56 38 58 36 60 34 C62 38 62 42 66 44 C68 38 66 30 60 22Z"
        fill="url(#flameGrad)" opacity="0.9"/>

  <!-- Top brick (smaller, centered) -->
  <rect x="38" y="50" width="44" height="14" rx="3" fill="rgba(255,255,255,0.92)"/>
  <line x1="60" y1="50" x2="60" y2="64" stroke="rgba(200,70,10,0.3)" stroke-width="1.5"/>

  <!-- Middle row bricks -->
  <rect x="26" y="67" width="30" height="14" rx="3" fill="rgba(255,255,255,0.85)"/>
  <rect x="59" y="67" width="30" height="14" rx="3" fill="rgba(255,255,255,0.85)"/>

  <!-- Bottom row bricks -->
  <rect x="20" y="84" width="24" height="14" rx="3" fill="rgba(255,255,255,0.75)"/>
  <rect x="47" y="84" width="24" height="14" rx="3" fill="rgba(255,255,255,0.75)"/>
  <rect x="74" y="84" width="24" height="14" rx="3" fill="rgba(255,255,255,0.75)"/>

  <!-- Mortar lines (subtle) -->
  <line x1="41" y1="84" x2="41" y2="98" stroke="rgba(200,70,10,0.2)" stroke-width="1"/>
  <line x1="68" y1="84" x2="68" y2="98" stroke="rgba(200,70,10,0.2)" stroke-width="1"/>

  <!-- Shine overlay -->
  <ellipse cx="50" cy="35" rx="22" ry="12" fill="rgba(255,255,255,0.08)"/>
</svg>
