<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Brick Pattern -->
  <defs>
    <linearGradient id="brickGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cf6d17;stop-opacity:1" />
    </linearGradient>
    <pattern id="brickPattern" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="url(#brickGradient)" opacity="0.3"/>
      <line x1="0" y1="10" x2="40" y2="10" stroke="#d35400" stroke-width="1" opacity="0.5"/>
      <line x1="20" y1="0" x2="20" y2="20" stroke="#d35400" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Main Background -->
  <rect width="200" height="100" fill="url(#brickPattern)" rx="10"/>
  
  <!-- Brick Icon -->
  <rect x="20" y="30" width="50" height="30" fill="url(#brickGradient)" rx="3" stroke="#fff" stroke-width="2"/>
  <line x1="20" y1="45" x2="70" y2="45" stroke="#fff" stroke-width="1" opacity="0.5"/>
  <line x1="45" y1="30" x2="45" y2="60" stroke="#fff" stroke-width="1" opacity="0.5"/>
  
  <!-- Company Name -->
  <text x="85" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">
    गुरुकृपा
  </text>
  <text x="85" y="65" font-family="Arial, sans-serif" font-size="14" fill="#fff" opacity="0.9">
    ईंट उद्योग
  </text>
  
  <!-- Decorative Elements -->
  <circle cx="170" cy="30" r="8" fill="#fff" opacity="0.3"/>
  <circle cx="170" cy="70" r="8" fill="#fff" opacity="0.3"/>
</svg>


