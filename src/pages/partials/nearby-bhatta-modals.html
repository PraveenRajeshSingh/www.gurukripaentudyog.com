    <!-- Nearby supplier detail -->
    <div class="modal-overlay" id="nearbyDetailModal" role="dialog" aria-modal="true" aria-labelledby="nearbyDetailTitle" onclick="if(event.target===this)NearbyBhatta.closeDetail()">
        <div class="modal-box modal-box--lg nearby-detail-box">
            <div class="modal-head">
                <div>
                    <h3 class="modal-title" id="nearbyDetailTitle">Supplier details</h3>
                    <p class="modal-subtitle" id="nearbyDetailSub"></p>
                </div>
                <button type="button" class="modal-close-btn" onclick="NearbyBhatta.closeDetail()" aria-label="Close supplier details">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body" id="nearbyDetailBody"></div>
            <div class="modal-foot nearby-detail-foot" id="nearbyDetailFoot"></div>
        </div>
    </div>

    <!-- Nearby supplier comparison -->
    <div class="modal-overlay" id="nearbyCompareModal" role="dialog" aria-modal="true" aria-labelledby="nearbyCompareTitle" onclick="if(event.target===this)NearbyBhatta.closeCompare()">
        <div class="modal-box modal-box--lg">
            <div class="modal-head">
                <div>
                    <h3 class="modal-title" id="nearbyCompareTitle">Compare suppliers</h3>
                    <p class="modal-subtitle">Only verified fields are shown. Missing values mean the data is not publicly confirmed.</p>
                </div>
                <button type="button" class="modal-close-btn" onclick="NearbyBhatta.closeCompare()" aria-label="Close comparison">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body" id="nearbyCompareBody"></div>
        </div>
    </div>

    <!-- Nearby quotation request (reuses QuotationService ledger) -->
    <div class="modal-overlay" id="nearbyQuoteModal" role="dialog" aria-modal="true" aria-labelledby="nearbyQuoteTitle" onclick="if(event.target===this)NearbyBhatta.closeQuote()">
        <div class="modal-box modal-box--md">
            <div class="modal-head">
                <div>
                    <h3 class="modal-title" id="nearbyQuoteTitle">Request brick quotation</h3>
                    <p class="modal-subtitle" id="nearbyQuoteSub">Logged to your existing enquiries on this device.</p>
                </div>
                <button type="button" class="modal-close-btn" onclick="NearbyBhatta.closeQuote()" aria-label="Close quotation form">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="nearbyQuoteForm" novalidate>
                    <input type="hidden" id="nqSupplierId">
                    <input type="hidden" id="nqSupplierName">
                    <div class="auth-field">
                        <label class="auth-label" for="nqName">Your name *</label>
                        <input type="text" id="nqName" class="auth-input" required autocomplete="name">
                    </div>
                    <div class="auth-field">
                        <label class="auth-label" for="nqPhone">Mobile (10 digits) *</label>
                        <input type="tel" id="nqPhone" class="auth-input" required pattern="[0-9]{10}" inputmode="numeric" autocomplete="tel">
                    </div>
                    <div class="nearby-quote-grid">
                        <div class="auth-field">
                            <label class="auth-label" for="nqBrickType">Brick type *</label>
                            <select id="nqBrickType" class="auth-input" required>
                                <option value="first-class">First-Class Red Clay</option>
                                <option value="second-class">Second-Class</option>
                                <option value="fly-ash">Fly Ash</option>
                                <option value="wire-cut">Wire-Cut</option>
                                <option value="aac">AAC Blocks</option>
                                <option value="concrete-block">Concrete Blocks</option>
                                <option value="awwal">Awwal (Gurukripa catalogue)</option>
                                <option value="laal-peti">Laal Peti (Gurukripa catalogue)</option>
                            </select>
                        </div>
                        <div class="auth-field">
                            <label class="auth-label" for="nqQty">Quantity (pcs) *</label>
                            <input type="number" id="nqQty" class="auth-input" min="1000" step="500" value="4000" required>
                        </div>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label" for="nqAddress">Delivery address *</label>
                        <textarea id="nqAddress" class="auth-input" rows="3" required placeholder="Site address, landmark, PIN"></textarea>
                    </div>
                    <div id="nqCostPreview" class="nearby-cost-preview" hidden></div>
                    <p class="auth-error-msg" id="nqError" role="alert" hidden></p>
                    <button type="submit" class="btn btn-primary btn-full">Submit enquiry</button>
                </form>
            </div>
        </div>
    </div>
