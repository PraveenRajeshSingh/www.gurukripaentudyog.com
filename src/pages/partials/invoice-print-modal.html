    <!-- ━━━━━━━━━━━━━━━━━ INVOICE PREVIEW / PDF MODAL ━━━━━━━━━━━━━━━━━ -->
    <div class="modal-overlay" id="invoicePdfModal" role="dialog" aria-modal="true" aria-label="Invoice preview" onclick="if(event.target.id==='invoicePdfModal')closeInvoicePdf()">
        <div class="modal-box modal-box--xl inv-pdf-box order-modal" role="document">
            <div class="modal-head order-modal__header">
                <div>
                    <div class="modal-title">Invoice &amp; PDF</div>
                    <div class="modal-subtitle" id="invPdfSubtitle">Preview, download or print a GST invoice</div>
                </div>
                <button type="button" class="modal-close-btn" onclick="closeInvoicePdf()" aria-label="Close"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            </div>
            <div class="modal-body order-modal__content inv-pdf-body">
                <iframe id="invPdfFrame" class="inv-pdf-frame" title="Invoice preview"></iframe>
            </div>
            <div class="modal-foot order-modal__footer inv-pdf-actions">
                <button type="button" class="btn btn-outline btn-sm" onclick="printCurrentInvoice()">Print / Save PDF</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="downloadCurrentInvoice()">Download</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="shareCurrentInvoice()">Share</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="resendCurrentInvoice()">Resend</button>
                <button type="button" class="btn btn-primary btn-sm" onclick="closeInvoicePdf()">Close</button>
            </div>
        </div>
    </div>
