    <!-- ━━━━━━━━━━━━━━━━━ INVOICE PREVIEW / PDF MODAL ━━━━━━━━━━━━━━━━━ -->
    <div class="modal-overlay" id="invoicePdfModal" role="dialog" aria-modal="true" aria-label="Invoice preview" onclick="if(event.target.id==='invoicePdfModal')closeInvoicePdf()">
        <div class="modal-box inv-pdf-box">
            <div class="modal-head" style="padding:14px 20px;border-bottom:1px solid var(--line)">
                <div>
                    <div class="modal-title" style="font-size:1.05rem">Invoice &amp; PDF</div>
                    <div class="modal-subtitle" id="invPdfSubtitle">Preview, download or print a GST invoice</div>
                </div>
                <button type="button" class="modal-close-btn" onclick="closeInvoicePdf()" aria-label="Close">✕</button>
            </div>
            <div class="modal-body inv-pdf-body">
                <iframe id="invPdfFrame" class="inv-pdf-frame" title="Invoice preview"></iframe>
            </div>
            <div class="inv-pdf-actions">
                <button type="button" class="btn btn-outline btn-sm" onclick="printCurrentInvoice()">🖨️ Print / Save PDF</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="downloadCurrentInvoice()">⬇️ Download</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="shareCurrentInvoice()">🔗 Share</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="resendCurrentInvoice()">✉️ Resend</button>
                <button type="button" class="btn btn-primary btn-sm" onclick="closeInvoicePdf()">Close</button>
            </div>
        </div>
    </div>
