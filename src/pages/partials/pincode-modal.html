    <!-- ━━━━━━━━━━━━━━━━━ PINCODE & FREIGHT RATE DELIVERY MODAL ━━━━━━━━━━━━━━━━━ -->
    <div class="modal-overlay" id="pincodeModal" role="dialog" aria-modal="true" aria-label="Delivery availability check" onclick="if(event.target===this)closePincodeModal()">
        <div class="modal-box modal-box--md" id="pincodeModalBox">
            <div class="modal-head">
                <div>
                    <div class="modal-badge" aria-hidden="true">
                        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                    </div>
                    <h3 class="modal-title">Delivery &amp; Freight Checker</h3>
                    <p class="modal-subtitle">Direct from Gurukripa Kiln, Newada, Jalalpur</p>
                </div>
                <button type="button" class="modal-close-btn" onclick="closePincodeModal()" aria-label="Close delivery modal">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="modal-body">
                <div class="auth-field">
                    <label class="auth-label" for="modalPincodeInput">Enter 6-digit Delivery Pincode</label>
                    <div class="pin-check-row">
                        <input type="tel" id="modalPincodeInput" class="auth-input pin-check-input" maxlength="6" placeholder="e.g. 222001 or 221001" inputmode="numeric"
                            oninput="if(this.value.trim().length===6)runModalPincodeCheck()">
                        <button type="button" class="btn btn-primary" onclick="runModalPincodeCheck()">Check</button>
                    </div>
                </div>

                <div class="pin-hubs">
                    <div class="pin-hubs__label">Quick delivery hubs</div>
                    <div class="pin-hubs__chips">
                        <button type="button" class="btn-pill-chip" onclick="setModalPincode('222001')">Jaunpur City (222001)</button>
                        <button type="button" class="btn-pill-chip" onclick="setModalPincode('221001')">Varanasi (221001)</button>
                        <button type="button" class="btn-pill-chip" onclick="setModalPincode('222105')">Kerakat (222105)</button>
                        <button type="button" class="btn-pill-chip" onclick="setModalPincode('222003')">Mariahu (222003)</button>
                        <button type="button" class="btn-pill-chip" onclick="setModalPincode('222125')">Badlapur (222125)</button>
                        <button type="button" class="btn-pill-chip" onclick="setModalPincode('275301')">Azamgarh (275301)</button>
                    </div>
                </div>

                <div class="pin-vehicle">
                    <div class="pin-vehicle__title">Site road access &amp; vehicle compatibility</div>
                    <div class="pin-vehicle__grid">
                        <label class="pin-vehicle__option">
                            <input type="radio" name="modalVehicle" id="vehTrolley" value="trolley" checked onchange="runModalPincodeCheck()">
                            <span>
                                <strong>Mini Trolley (4k pcs)</strong>
                                <small>Narrow streets &lt; 12ft</small>
                            </span>
                        </label>
                        <label class="pin-vehicle__option">
                            <input type="radio" name="modalVehicle" id="vehTruck" value="truck" onchange="runModalPincodeCheck()">
                            <span>
                                <strong>Heavy Truck (10k+ pcs)</strong>
                                <small>Wide road &gt; 18ft</small>
                            </span>
                        </label>
                    </div>
                </div>

                <div id="modalPincodeResult" class="pin-result" style="display:none"></div>

                <div class="pin-guarantee" role="note">
                    <strong>Gurukripa Kiln Guarantee:</strong> Zero breakage replacement on unloading. Free delivery within 10 km.
                </div>
            </div>

            <div class="modal-foot">
                <button type="button" class="btn btn-outline" onclick="closePincodeModal()">Close</button>
                <button type="button" class="btn btn-primary gb-btn-whatsapp" id="modalPincodeWaBtn" onclick="whatsappModalDeliveryQuote()">
                    Confirm on WhatsApp
                </button>
            </div>
        </div>
    </div>
