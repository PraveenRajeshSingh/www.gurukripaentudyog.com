    <!-- ━━━━━━━━━━━━━━━━━ AUTH MODAL ━━━━━━━━━━━━━━━━━ -->
    <div class="modal-overlay" id="authModal" onclick="handleAuthOverlayClick(event)">
        <div class="modal-box" id="authModalBox">
            <div class="auth-modal-brand">
                <div class="auth-brand-icon"><svg width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="1.5"/><line x1="8" y1="7" x2="8" y2="17"/><line x1="16" y1="7" x2="16" y2="17"/></svg></div>
            </div>
            <div class="modal-head" style="padding-top:8px">
                <div>
                    <div class="modal-badge" id="authBadge"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
                    <div class="modal-title" id="authTitle">Sign In</div>
                    <div class="modal-subtitle" id="authSubtitle">Welcome back!</div>
                </div>
                <button class="modal-close-btn" onclick="closeAuth()">✕</button>
            </div>
            <div class="modal-body">
                <!-- Rate Limit Lockout Warning -->
                <div class="auth-lockout" id="authLockoutAlert">
                    ⚠️ Too many failed attempts. Try again in <strong id="lockoutTimer">30</strong>s.
                </div>

                <!-- Tabs -->
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchAuthTab('login',this)" id="tabLogin">Sign In</button>
                    <button class="auth-tab" onclick="switchAuthTab('register',this)" id="tabRegister">Sign Up</button>
                </div>

                <!-- Login Panel -->
                <div id="loginPanel">
                    <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
                        <div class="auth-field">
                            <label class="auth-label" for="loginEmail">Email Address</label>
                            <div class="auth-input-wrap">
                                <span class="auth-icon"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,6 12,13 2,6"/></svg></span>
                                <input type="email" id="loginEmail" name="email" class="auth-input"
                                    placeholder="your@email.com" required autocomplete="email">
                                <span class="auth-error-msg" id="loginEmailErr"></span>
                            </div>
                        </div>
                        <div class="auth-field">
                            <label class="auth-label" for="loginPassword">Password</label>
                            <div class="auth-input-wrap">
                                <span class="auth-icon"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
                                <input type="password" id="loginPassword" name="password" class="auth-input"
                                    placeholder="Enter password" required autocomplete="current-password"
                                    style="padding-right:44px">
                                <button type="button" class="auth-pw-toggle"
                                    onclick="togglePw('loginPassword','loginPwEye')" id="loginPwEye"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                                <span class="auth-error-msg" id="loginPasswordErr"></span>
                            </div>
                        </div>
                        <div class="auth-options">
                            <label class="auth-check"><input type="checkbox" id="rememberMe" checked> Remember me</label>
                            <a href="#" class="auth-forgot" onclick="handleForgotPw(event)">Forgot password?</a>
                        </div>
                        <button type="submit" class="auth-submit" id="loginSubmitBtn">
                            <span>Sign In to Account</span> →
                        </button>
                        <div class="auth-divider"><span data-i18n="auth.orContinue">or continue with</span></div>
                        <div id="googleGsiBtn" class="google-gsi-mount" style="display:none;justify-content:center;margin-bottom:10px"></div>
                        <div class="auth-social-btns">
                            <button type="button" class="auth-social-btn" id="googleCustomBtn"
                                onclick="handleGoogleSignIn()">
                                <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
                                    <path
                                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                                        fill="#4285F4" />
                                    <path
                                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                        fill="#34A853" />
                                    <path
                                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                        fill="#FBBC05" />
                                    <path
                                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                        fill="#EA4335" />
                                </svg>
                                Google
                            </button>
                            <button type="button" class="auth-social-btn"
                                onclick="openOtpPanel()">
                                <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
                                    <path
                                        d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
                                        fill="#6366F1" />
                                </svg>
                                OTP Code
                            </button>
                        </div>
                        <p class="auth-switch">Don't have an account? <a href="#"
                                onclick="switchAuthTab('register');return false">Sign Up →</a></p>
                    </form>
                </div>

                <!-- OTP Verification Panel -->
                <div id="otpPanel" style="display:none;text-align:center;padding:12px 0">
                    <p style="font-size:.86rem;color:var(--ink-2);margin-bottom:8px">Enter the 6-digit OTP code sent to your mobile number:</p>
                    <div class="otp-row">
                        <input type="text" maxlength="1" class="otp-digit" data-idx="0" pattern="[0-9]" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-digit" data-idx="1" pattern="[0-9]" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-digit" data-idx="2" pattern="[0-9]" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-digit" data-idx="3" pattern="[0-9]" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-digit" data-idx="4" pattern="[0-9]" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-digit" data-idx="5" pattern="[0-9]" inputmode="numeric">
                    </div>
                    <button class="auth-submit" onclick="verifyOtp()" id="otpSubmitBtn" style="margin-top:14px">Verify OTP Code →</button>
                    <button class="btn btn-ghost btn-full" onclick="closeOtpPanel()" style="margin-top:8px">← Back to Password Sign In</button>
                </div>

                <!-- Register Panel -->
                <div id="registerPanel" style="display:none">
                    <form id="registerForm" onsubmit="handleRegister(event)" novalidate>
                        <div class="auth-row">
                            <div class="auth-field">
                                <label class="auth-label" for="regName">Full Name</label>
                                <div class="auth-input-wrap">
                                    <span class="auth-icon"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                                    <input type="text" id="regName" name="name" class="auth-input"
                                        placeholder="Your full name" required autocomplete="name">
                                    <span class="auth-error-msg" id="regNameErr"></span>
                                </div>
                            </div>
                            <div class="auth-field">
                                <label class="auth-label" for="regMobile">Mobile</label>
                                <div class="auth-input-wrap">
                                    <span class="auth-icon"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg></span>
                                    <input type="tel" id="regMobile" name="mobile" class="auth-input"
                                        placeholder="10-digit number" pattern="[0-9]{10}" required inputmode="numeric">
                                    <span class="auth-error-msg" id="regMobileErr"></span>
                                </div>
                            </div>
                        </div>
                        <div class="auth-field">
                            <label class="auth-label" for="regEmail">Email Address</label>
                            <div class="auth-input-wrap">
                                <span class="auth-icon"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,6 12,13 2,6"/></svg></span>
                                <input type="email" id="regEmail" name="email" class="auth-input"
                                    placeholder="your@email.com" required autocomplete="email">
                                <span class="auth-error-msg" id="regEmailErr"></span>
                            </div>
                        </div>
                        <div class="auth-row">
                            <div class="auth-field">
                                <label class="auth-label" for="regPassword">Password</label>
                                <div class="auth-input-wrap">
                                    <span class="auth-icon"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
                                    <input type="password" id="regPassword" name="password" class="auth-input"
                                        placeholder="Min 6 characters" required autocomplete="new-password"
                                        oninput="checkPwStrength(this.value)" style="padding-right:44px">
                                    <button type="button" class="auth-pw-toggle"
                                        onclick="togglePw('regPassword','regPwEye')" id="regPwEye"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                                    <span class="auth-error-msg" id="regPasswordErr"></span>
                                    <div class="pw-strength">
                                        <div class="pw-strength-bar">
                                            <div class="pw-strength-fill" id="pwStrengthFill"
                                                style="width:0%;background:var(--brand)"></div>
                                        </div>
                                        <div class="pw-strength-text" id="pwStrengthText"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="auth-field">
                                <label class="auth-label" for="regConfirm">Confirm Password</label>
                                <div class="auth-input-wrap">
                                    <span class="auth-icon"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
                                    <input type="password" id="regConfirm" name="confirmPassword" class="auth-input"
                                        placeholder="Repeat password" required autocomplete="new-password"
                                        style="padding-right:44px">
                                    <button type="button" class="auth-pw-toggle"
                                        onclick="togglePw('regConfirm','regConfirmEye')" id="regConfirmEye"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                                    <span class="auth-error-msg" id="regConfirmErr"></span>
                                </div>
                            </div>
                        </div>
                        <label class="auth-check auth-terms-check">
                            <input type="checkbox" id="regTerms">
                            <span data-i18n="auth.iAgree">I agree to the</span>
                            <a href="#" onclick="showToast(t('footer.termsSoon'));return false" data-i18n="auth.terms">Terms</a>
                            <span>&amp;</span>
                            <a href="#" onclick="showToast(t('footer.privacySoon'));return false" data-i18n="auth.privacy">Privacy Policy</a>
                        </label>
                        <div class="auth-error-msg auth-terms-err" id="regTermsErr"></div>
                        <button type="submit" class="auth-submit" id="registerSubmitBtn">
                            <span>Create Free Account</span> →
                        </button>
                        <div class="auth-divider"><span data-i18n="auth.orContinue">or continue with</span></div>
                        <div id="googleGsiBtnReg" class="google-gsi-mount" style="display:none;justify-content:center;margin-bottom:10px"></div>
                        <div class="auth-social-btns">
                            <button type="button" class="auth-social-btn" id="googleCustomBtnReg"
                                onclick="handleGoogleSignIn()">
                                <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
                                    <path
                                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                                        fill="#4285F4" />
                                    <path
                                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                        fill="#34A853" />
                                    <path
                                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                        fill="#FBBC05" />
                                    <path
                                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                        fill="#EA4335" />
                                </svg>
                                Google
                            </button>
                        </div>
                        <p class="auth-switch">Already have an account? <a href="#"
                                onclick="switchAuthTab('login');return false">Sign In →</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
