<!-- CHANGE: branded page loader (§4) — inline critical CSS + SVG, <2KB, no external assets.
     Shows only if not interactive within ~300ms; removed on DOMContentLoaded+hero decode or 2.5s; hard failsafe 6s. -->
<style id="gbi-loader-css">
#gbi-page-loader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:linear-gradient(160deg,#7B241C 0%,#A93226 55%,#C0392B 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;opacity:0;pointer-events:none;transition:opacity .35s ease}
#gbi-page-loader.is-on{opacity:1;pointer-events:auto}
#gbi-page-loader.is-out{opacity:0;pointer-events:none}
#gbi-page-loader .gbi-ld-mark{width:64px;height:64px}
#gbi-page-loader .gbi-ld-bricks{display:flex;flex-direction:column;gap:4px;width:56px}
#gbi-page-loader .gbi-ld-bricks span{display:block;height:10px;border-radius:2px;background:rgba(255,255,255,.85);transform-origin:center;animation:gbiBrick 1.1s ease-in-out infinite}
#gbi-page-loader .gbi-ld-bricks span:nth-child(1){width:100%;animation-delay:0s}
#gbi-page-loader .gbi-ld-bricks span:nth-child(2){width:78%;margin-left:11%;animation-delay:.15s}
#gbi-page-loader .gbi-ld-bricks span:nth-child(3){width:56%;margin-left:22%;animation-delay:.3s}
#gbi-page-loader .gbi-ld-text{font-size:13px;letter-spacing:.02em;text-align:center;line-height:1.35;max-width:16rem;opacity:.95}
#gbi-page-loader .gbi-ld-fail{display:none;font-size:13px;text-align:center;max-width:18rem}
#gbi-page-loader.is-fail .gbi-ld-bricks,#gbi-page-loader.is-fail .gbi-ld-text{display:none}
#gbi-page-loader.is-fail .gbi-ld-fail{display:block}
#gbi-page-loader .gbi-ld-fail a{color:#fff;font-weight:600;text-decoration:underline}
@keyframes gbiBrick{0%,100%{opacity:.35;transform:scaleX(.92)}50%{opacity:1;transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#gbi-page-loader .gbi-ld-bricks span{animation:none;opacity:.85}}
html[data-theme=dark] #gbi-page-loader{background:linear-gradient(160deg,#1a0a08 0%,#7B241C 60%,#A93226 100%)}
</style>
<div id="gbi-page-loader" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Gurukripa Bricks Industry">
  <svg class="gbi-ld-mark" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true" focusable="false">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#FAF6F2"/>
    <text x="32" y="36" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#A93226">GE</text>
    <rect x="16" y="42" width="10" height="5" rx="1" fill="#A93226"/>
    <rect x="27" y="42" width="10" height="5" rx="1" fill="#A93226"/>
    <rect x="38" y="42" width="10" height="5" rx="1" fill="#7B241C"/>
  </svg>
  <div class="gbi-ld-bricks" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="gbi-ld-text">गुरुकृपा ईंट उद्योग<br>Gurukripa Bricks Industry</div>
  <div class="gbi-ld-fail">Could not load. <a href="./">Retry</a> / <a href="tel:+919198923230">Call the yard</a></div>
</div>
<script>
(function(){
  /* CHANGE: loader show/hide logic — delayed show, early dismiss, 6s failsafe */
  var el=document.getElementById('gbi-page-loader');
  if(!el)return;
  var shown=false,gone=false,showT,capT,failT;
  function removeLoader(){
    if(gone)return;gone=true;
    el.classList.add('is-out');el.classList.remove('is-on');
    el.setAttribute('aria-busy','false');
    setTimeout(function(){try{el.remove();var c=document.getElementById('gbi-loader-css');if(c)c.remove();}catch(e){}},400);
  }
  function show(){
    if(gone||shown)return;shown=true;el.classList.add('is-on');
  }
  showT=setTimeout(show,300);
  function ready(){
    clearTimeout(showT);
    var hero=document.querySelector('.hero img, #hero img, img[fetchpriority="high"]');
    var finish=function(){clearTimeout(capT);removeLoader();};
    if(hero&&typeof hero.decode==='function'){
      var p=hero.decode();
      if(p&&p.then)p.then(finish).catch(finish);
      else finish();
    }else finish();
  }
  capT=setTimeout(function(){clearTimeout(showT);removeLoader();},2500);
  failT=setTimeout(function(){
    if(gone)return;
    if(shown){el.classList.add('is-fail');el.setAttribute('aria-busy','false');}
    setTimeout(removeLoader,1500);
  },6000);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);
  else ready();
  window.addEventListener('pageshow',function(e){if(e.persisted)removeLoader();});
})();
</script>
<noscript>
<style>#gbi-page-loader{display:none!important}</style>
</noscript>
