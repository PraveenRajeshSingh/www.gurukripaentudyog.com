    <!-- ━━━━━━━━━━━━━━━━━ PRODUCTS ━━━━━━━━━━━━━━━━━ -->
    <section class="sec products-sec" id="products">
        <div class="container">
            <div class="text-center">
                <span class="sec-tag" data-i18n="products.tag">Verified Quality</span>
                <h2 class="sec-title" data-i18n="products.title">Our Products</h2>
                <p class="sec-sub" data-i18n="products.desc">Grade-A bricks tested for strength, uniformity and weather resistance</p>
            </div>
            <div class="products-filters">
                <button class="filter-btn active" onclick="filterProducts('all',this)">All Products</button>
                <button class="filter-btn" onclick="filterProducts('shiv-eent',this)">Shiv Eent</button>
                <button class="filter-btn" onclick="filterProducts('awwal',this)">Awwal ईंट</button>
                <button class="filter-btn" onclick="filterProducts('laal-peti',this)">Laal Peti</button>
                <button class="filter-btn" onclick="filterProducts('premium',this)">Premium</button>
                <button class="filter-btn" onclick="filterProducts('standard',this)">Standard</button>
                <button class="filter-btn" onclick="filterProducts('machine-made',this)">Machine Made</button>
            </div>
            <div class="products-toolbar">
                <div class="products-toolbar-left">
                    <span class="products-count" id="productsCount">7 products</span>
                </div>
                <div class="products-toolbar-right">
                    <select class="products-sort" id="productsSort" onchange="sortProducts(this.value)" aria-label="Sort products">
                        <option value="default">Sort by: Default</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="name-asc">Name: A to Z</option>
                        <option value="rating-desc">Top Rated</option>
                    </select>
                </div>
            </div>
            <div class="products-grid" id="productsGrid">
                <!-- Rendered by JS -->
            </div>
        </div>
    </section>
