    <!-- Language before paint (Phase 1) — no flash of wrong language -->
    <script>
      (function () {
        try {
          var l = null;
          try { l = localStorage.getItem('gb_lang'); } catch (e) { l = null; }
          if (l !== 'en' && l !== 'hi') {
            var nav = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
            l = nav.indexOf('hi') === 0 ? 'hi' : 'en';
          }
          document.documentElement.setAttribute('lang', l === 'hi' ? 'hi' : 'en');
          document.documentElement.setAttribute('data-lang', l);
          document.documentElement.setAttribute('dir', 'ltr');
        } catch (e) {}
      })();
    </script>
    <!-- Theme before paint (Phase 2): Light / Dark / System — no flash -->
    <script>
      (function () {
        try {
          var mode = null;
          try { mode = localStorage.getItem('gb_theme_mode'); } catch (e) { mode = null; }
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
            try {
              var legacy = localStorage.getItem('gb_theme');
              mode = (legacy === 'light' || legacy === 'dark') ? legacy : 'system';
            } catch (e2) { mode = 'system'; }
          }
          var resolved = mode;
          if (mode === 'system') {
            try {
              resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            } catch (e3) { resolved = 'light'; }
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-mode', mode);
          document.documentElement.style.colorScheme = resolved === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <!-- CHANGE: recover from a poisoned service worker that served "Offline" as CSS/JS -->
    <script>
      (function () {
        function tokensMissing() {
          try {
            return !String(getComputedStyle(document.documentElement).getPropertyValue('--brand') || '').trim();
          } catch (e) { return false; }
        }
        function nukeAndReload() {
          try {
            if (sessionStorage.getItem('gbi_sw_recover') === '1') return;
            sessionStorage.setItem('gbi_sw_recover', '1');
          } catch (e) { /* ignore */ }
          var done = function () { try { location.reload(); } catch (e2) {} };
          var clearCaches = function () {
            if (!window.caches || !caches.keys) return Promise.resolve();
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          };
          var unreg = Promise.resolve();
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            unreg = navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            });
          }
          unreg.then(clearCaches).then(done).catch(done);
        }
        function check() {
          if (!tokensMissing()) {
            try { sessionStorage.removeItem('gbi_sw_recover'); } catch (e) {}
            return;
          }
          // Confirm CSS was poisoned (body "Offline") before nuking — avoid false positives
          fetch('src/styles/tokens.css', { cache: 'reload' }).then(function (r) {
            return r.text().then(function (t) {
              var poisoned = r.status === 503 || /^\s*Offline\s*$/i.test(t) || t.indexOf('--brand') < 0;
              if (poisoned && tokensMissing()) nukeAndReload();
            });
          }).catch(function () {
            if (tokensMissing()) nukeAndReload();
          });
        }
        if (document.readyState === 'complete') setTimeout(check, 50);
        else window.addEventListener('load', function () { setTimeout(check, 80); });
      })();
    </script>

    <!-- Boot unlock: clear stuck scroll locks once (do not keep closing UI after boot) -->
    <script>
      (function () {
        var bootDone = false;
        function unlock(closeOverlays) {
          try {
            var html = document.documentElement;
            var body = document.body;
            if (!body) return;
            html.classList.remove('msearch-open', 'popup-open', 'kb-up', 'overlay-open');
            body.classList.remove('overlay-open', 'account-popup-open', 'gb-chat-open');
            ['top','left','right','width','position','overflow','height','max-height'].forEach(function (p) {
              body.style.removeProperty(p);
            });
            if (closeOverlays) {
              document.querySelectorAll('.modal-overlay.open, .cart-overlay.open, .drawer-overlay.open, .lb-overlay.open, #lb.open, .cart-drawer.open, .wishlist-drawer.open, .drawer.open, .chatbot-wrap.open').forEach(function (el) {
                el.classList.remove('open');
              });
              var ms = document.getElementById('mobileSearchOverlay');
              if (ms) ms.hidden = true;
              var loader = document.getElementById('gbi-page-loader');
              if (loader) {
                loader.classList.add('is-out','is-gone');
                loader.style.cssText = 'display:none!important;pointer-events:none!important';
              }
            }
          } catch (e) {}
        }
        unlock(true);
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            unlock(true);
            bootDone = true;
          });
        } else {
          bootDone = true;
        }
        window.addEventListener('load', function () {
          unlock(!bootDone);
          bootDone = true;
        });
        setTimeout(function () { unlock(false); }, 0);
        setTimeout(function () { unlock(false); }, 300);
      })();
    </script>
