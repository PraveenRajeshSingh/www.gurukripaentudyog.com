<!-- Phase 4: full-screen mobile search — replaces header + bottom nav while open -->
<div id="mobileSearchOverlay" class="msearch-overlay" role="dialog" aria-modal="true" aria-label="Search" hidden>
  <div class="msearch-bar">
    <button type="button" class="msearch-back" data-action="close-search" aria-label="Close search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <input type="search" id="mobileSearchInput" class="msearch-input" enterkeyhint="search"
      autocomplete="off" inputmode="search" data-i18n-placeholder="search.placeholder"
      placeholder="Search bricks, prices..." aria-label="Search brick products" aria-autocomplete="list" aria-controls="mobileSearchSuggest">
    <button type="button" class="msearch-clear" id="mobileSearchClear" hidden data-action="clear-search" aria-label="Clear search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <button type="button" class="msearch-mic" data-action="voice-search" aria-label="Voice search" title="Voice search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
  </div>
  <div class="msearch-body" id="mobileSearchBody">
    <p class="msearch-hint" data-i18n="search.hint">Type a brick grade, size, or price</p>
    <div id="mobileSearchSuggest" class="msearch-suggest" role="listbox" aria-label="Search suggestions"></div>
    <div id="mobileSearchEmpty" class="msearch-empty" hidden data-i18n="search.noResults">No products match that search.</div>
  </div>
</div>
