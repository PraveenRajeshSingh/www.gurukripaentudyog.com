    <!-- ━━━━━━━━━━━━━━━━━ ORDER & RATE ALERT CENTER ━━━━━━━━━━━━━━━━━ -->
    <div class="modal-overlay" id="notificationCenterModal" onclick="if(event.target.id==='notificationCenterModal')closeNotificationCenter()">
        <div class="modal-box alert-center-box">
            <div class="modal-head">
                <div>
                    <div class="modal-badge">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                            <path d="M13.73 21a2 2 0 01-3.46 0" />
                        </svg>
                    </div>
                    <div class="modal-title">Order &amp; Rate Alerts</div>
                    <div class="modal-subtitle" id="alertUnreadCount">All caught up</div>
                </div>
                <button class="modal-close-btn" onclick="closeNotificationCenter()" aria-label="Close alerts">✕</button>
            </div>

            <div class="modal-body">
                <!-- Permission -->
                <div class="alert-permission-card">
                    <div class="alert-permission-row">
                        <span class="alert-permission-icon" aria-hidden="true">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                                <path d="M13.73 21a2 2 0 01-3.46 0" />
                            </svg>
                        </span>
                        <div class="alert-permission-text">
                            <div class="alert-state off" id="alertPermissionState">Checking notification support…</div>
                            <div class="alert-channel-note" id="alertChannelNote"></div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary btn-sm btn-full" id="alertEnableBtn" onclick="PushNotifications.enableAlerts()">
                        Enable notifications
                    </button>
                </div>

                <!-- What to alert on -->
                <div class="alert-prefs" role="group" aria-label="Alert preferences">
                    <label class="alert-pref-row">
                        <span class="alert-pref-text">
                            <strong>Order status updates</strong>
                            <span>Token, bhatta loading, dispatch and unloading alerts.</span>
                        </span>
                        <input type="checkbox" class="alert-switch" id="alertPrefOrders" onchange="PushNotifications.toggleAlertPref('orderUpdates', this)">
                    </label>
                    <label class="alert-pref-row">
                        <span class="alert-pref-text">
                            <strong>Wholesale rate drops</strong>
                            <span>Alert when a brick rate on the rate card goes down.</span>
                        </span>
                        <input type="checkbox" class="alert-switch" id="alertPrefPrices" onchange="PushNotifications.toggleAlertPref('priceDrops', this)">
                    </label>
                </div>

                <!-- Offline rate card -->
                <div class="alert-offline-card">
                    <div class="alert-offline-head">
                        <span class="alert-offline-icon" aria-hidden="true">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M12 2v13" />
                                <polyline points="6 9 12 15 18 9" />
                                <path d="M4 21h16" />
                            </svg>
                        </span>
                        <div>
                            <strong>Offline rate card</strong>
                            <span id="offlineStoreState">Checking device storage…</span>
                        </div>
                    </div>
                    <div class="alert-offline-actions">
                        <button type="button" class="btn btn-outline btn-sm" onclick="PushNotifications.downloadRateCard()">Download rates</button>
                        <button type="button" class="btn btn-outline btn-sm" onclick="PushNotifications.checkAlertsNow()">Check now</button>
                    </div>
                </div>

                <!-- History -->
                <div class="alert-list-head">
                    <span>Recent alerts</span>
                    <span class="alert-list-actions">
                        <button type="button" onclick="PushNotifications.markAllRead()">Mark read</button>
                        <button type="button" onclick="PushNotifications.clearAlerts()">Clear</button>
                    </span>
                </div>
                <div class="alert-list" id="alertList">
                    <div class="alert-empty">No alerts yet. Order updates and rate drops will appear here.</div>
                </div>
            </div>
        </div>
    </div>
