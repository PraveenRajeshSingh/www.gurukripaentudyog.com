    <!-- ━━━━━━━━━━━━━━━━━ PROFILE MODAL ━━━━━━━━━━━━━━━━━ -->
    <div class="modal-overlay" id="profileModal" onclick="handleProfileOverlayClick(event)">
        <div class="modal-box profile-modal-box" style="padding:0;overflow:hidden">
            <!-- Profile Dashboard Header -->
            <div class="profile-header">
                <button class="modal-close-btn profile-close-btn" onclick="closeProfile()" aria-label="Close Profile Modal" style="position:absolute;top:16px;right:16px;color:#fff;background:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.4);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;z-index:25;pointer-events:auto">✕</button>
                <div class="profile-header-inner">
                    <div class="profile-avatar-large" id="profileAvatarLg" style="background:var(--brand)">
                        <span id="profileAvatarLetter">U</span>
                    </div>
                    <div class="profile-header-info">
                        <div class="profile-header-name" id="profileHeaderName">User</div>
                        <div class="profile-header-email" id="profileHeaderEmail">user@email.com</div>
                        <span class="profile-header-badge">⭐ Verified Member</span>
                    </div>
                </div>
            </div>

            <!-- Profile Stats Row -->
            <div class="profile-stats">
                <div class="profile-stat">
                    <div class="profile-stat-num" id="profileStatOrders">0</div>
                    <div class="profile-stat-label">Orders</div>
                </div>
                <div class="profile-stat">
                    <div class="profile-stat-num" id="profileStatWishlist">0</div>
                    <div class="profile-stat-label">Wishlist</div>
                </div>
                <div class="profile-stat">
                    <div class="profile-stat-num" id="profileStatYear">1998</div>
                    <div class="profile-stat-label">Member Since</div>
                </div>
            </div>

            <!-- Profile Navigation Tabs -->
            <div class="profile-tabs">
                <button class="profile-tab active" onclick="switchProfileTab('info',this)">👤 Account Info</button>
                <button class="profile-tab" onclick="switchProfileTab('orders',this)">📦 My Orders</button>
                <button class="profile-tab" onclick="switchProfileTab('wishlist',this)">❤️ Wishlist</button>
                <button class="profile-tab" onclick="switchProfileTab('address',this)">📍 Address</button>
            </div>

            <div class="modal-body" style="padding:0">
                <!-- Tab 1: Account Info -->
                <div class="profile-tab-panel active" id="pTabInfo">
                    <!-- View Mode -->
                    <div id="profileViewMode">
                        <div class="profile-info-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
                            <div class="profile-info-card" style="background:var(--bg-subtle);padding:12px;border-radius:var(--r-sm)">
                                <div class="profile-info-label" id="profileNameLabel" style="font-size:.7rem;color:var(--ink-3);font-weight:600">FULL NAME</div>
                                <div class="profile-info-value" id="profileViewName" style="font-weight:700;color:var(--ink)">—</div>
                            </div>
                            <div class="profile-info-card" style="background:var(--bg-subtle);padding:12px;border-radius:var(--r-sm)">
                                <div class="profile-info-label" id="profileEmailLabel" style="font-size:.7rem;color:var(--ink-3);font-weight:600">EMAIL ADDRESS</div>
                                <div class="profile-info-value" id="profileViewEmail" style="font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis">—</div>
                            </div>
                            <div class="profile-info-card" style="background:var(--bg-subtle);padding:12px;border-radius:var(--r-sm)">
                                <div class="profile-info-label" id="profileMobileLabel" style="font-size:.7rem;color:var(--ink-3);font-weight:600">MOBILE NUMBER</div>
                                <div class="profile-info-value" id="profileViewMobile" style="font-weight:700;color:var(--ink)">—</div>
                            </div>
                            <div class="profile-info-card" style="background:var(--bg-subtle);padding:12px;border-radius:var(--r-sm)">
                                <div class="profile-info-label" id="profileAddressLabel" style="font-size:.7rem;color:var(--ink-3);font-weight:600">DELIVERY ADDRESS</div>
                                <div class="profile-info-value" id="profileViewAddress" style="font-weight:700;color:var(--ink)">—</div>
                            </div>
                        </div>
                        <div style="display:flex;gap:10px">
                            <button class="btn btn-primary btn-full" onclick="switchToEditProfile()" id="profileEditBtn">Edit Profile</button>
                            <button class="btn btn-outline btn-full" onclick="logoutUser();closeProfile()">Sign Out</button>
                        </div>
                    </div>
                    <!-- Edit Mode -->
                    <div id="profileEditMode" style="display:none">
                        <form id="profileEditForm" onsubmit="saveProfile(event)">
                            <div class="auth-field">
                                <label class="co-form-label" id="editNameLabel">Full Name</label>
                                <input type="text" class="co-input" id="editName" required>
                            </div>
                            <div class="auth-field" style="margin-top:10px">
                                <label class="co-form-label" id="editEmailLabel">Email Address</label>
                                <input type="email" class="co-input" id="editEmail" required>
                            </div>
                            <div class="auth-field" style="margin-top:10px">
                                <label class="co-form-label" id="editMobileLabel">Mobile Number</label>
                                <input type="tel" class="co-input" id="editMobile" pattern="[0-9]{10}">
                            </div>
                            <div class="auth-field" style="margin-top:10px">
                                <label class="co-form-label" id="editAddressLabel">Delivery Address</label>
                                <input type="text" class="co-input" id="editAddress" placeholder="Enter default delivery address">
                            </div>
                            <div class="profile-edit-actions" style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
                                <button type="submit" class="btn btn-primary btn-full" id="profileSaveBtn" style="flex:1;min-width:120px;min-height:44px">Save Changes</button>
                                <button type="button" class="btn btn-outline btn-full" onclick="cancelEditProfile()" id="profileCancelEditBtn" style="flex:1;min-width:100px;min-height:44px;cursor:pointer">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Tab 2: Order History -->
                <div class="profile-tab-panel" id="pTabOrders">
                    <div id="orderHistoryList"></div>
                </div>

                <!-- Tab 3: Wishlist -->
                <div class="profile-tab-panel" id="pTabWishlist">
                    <div class="wishlist-grid" id="profileWishlistGrid"></div>
                </div>

                <!-- Tab 4: Address -->
                <div class="profile-tab-panel" id="pTabAddress">
                    <div class="order-success-box">
                        <div style="font-weight:700;color:var(--ink);font-size:.9rem;margin-bottom:4px">📍 Default Delivery Address</div>
                        <div id="profileAddressDisplay" style="font-size:.84rem;color:var(--ink-2)">No saved address yet.</div>
                    </div>
                    <button class="btn btn-outline btn-full" onclick="switchProfileTab('info');switchToEditProfile()">Edit Address →</button>
                </div>
            </div>
        </div>
    </div>
