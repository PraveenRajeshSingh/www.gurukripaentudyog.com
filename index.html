<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#C8460A">
    <title>Gurukripa Bricks Industry | Premium Red Clay Bricks — Jaunpur</title>
    <meta name="description"
        content="Gurukripa Bricks Industry — Jaunpur's finest brick manufacturer since 1998. Grade-A red bricks, same-day delivery across Varanasi & UP.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&display=swap"
        rel="stylesheet">

    <style>
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DESIGN TOKENS
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        :root {
            /* Brand */
            --brand: #C8460A;
            --brand-dark: #8B2E05;
            --brand-amber: #F5A623;
            --brand-glow: rgba(200, 70, 10, 0.15);

            /* Surface */
            --bg: #FAFAF9;
            --bg-card: #FFFFFF;
            --bg-subtle: #F5F0EC;
            --bg-muted: #EDE5DF;

            /* Text */
            --ink: #1C1009;
            --ink-2: #4A3728;
            --ink-3: #9A8070;

            /* Border */
            --line: rgba(200, 70, 10, 0.10);
            --line-mid: rgba(200, 70, 10, 0.20);

            /* Radius */
            --r-sm: 8px;
            --r-md: 14px;
            --r-lg: 22px;
            --r-xl: 32px;

            /* Shadow */
            --sh-card: 0 2px 16px rgba(28, 16, 9, 0.07);
            --sh-hover: 0 10px 40px rgba(200, 70, 10, 0.14);
            --sh-modal: 0 32px 80px rgba(0, 0, 0, 0.22);

            /* Type */
            --display: 'Fraunces', Georgia, serif;
            --body: 'Plus Jakarta Sans', system-ui, sans-serif;

            /* Motion */
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --t: 0.22s;
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESET & BASE
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%
        }

        body {
            font-family: var(--body);
            background: var(--bg);
            color: var(--ink-2);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden
        }

        img {
            max-width: 100%;
            display: block
        }

        a {
            color: inherit;
            text-decoration: none
        }

        button {
            font-family: var(--body);
            cursor: pointer;
            border: none;
            background: none
        }

        input,
        textarea,
        select {
            font-family: var(--body)
        }

        ul {
            list-style: none
        }

        svg {
            display: block
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important
            }
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   SCROLL PROGRESS
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        #spbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, var(--brand), var(--brand-amber));
            z-index: 9999;
            pointer-events: none;
            transition: width .1s linear
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   UTILITIES
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 clamp(16px, 4vw, 32px)
        }

        .sec {
            padding: clamp(56px, 8vw, 100px) 0
        }

        .sec-tag {
            display: inline-block;
            background: rgba(200, 70, 10, .10);
            color: var(--brand);
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 50px;
            margin-bottom: 14px
        }

        .sec-title {
            font-family: var(--display);
            font-size: clamp(1.7rem, 3.5vw, 2.8rem);
            font-weight: 700;
            color: var(--ink);
            line-height: 1.2;
            margin-bottom: 12px
        }

        .sec-sub {
            font-size: clamp(.88rem, 1.5vw, 1.02rem);
            color: var(--ink-3);
            max-width: 520px;
            margin: 0 auto
        }

        .text-center {
            text-align: center
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            clip: rect(0, 0, 0, 0);
            overflow: hidden
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   BUTTONS
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 22px;
            border-radius: var(--r-md);
            font-weight: 600;
            font-size: .88rem;
            transition: all var(--t) var(--ease);
            white-space: nowrap;
            line-height: 1
        }

        .btn-primary {
            background: var(--brand);
            color: #fff;
            box-shadow: 0 4px 18px rgba(200, 70, 10, .25)
        }

        .btn-primary:hover {
            background: var(--brand-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(200, 70, 10, .35)
        }

        .btn-outline {
            background: transparent;
            color: var(--ink);
            border: 1.5px solid var(--line-mid)
        }

        .btn-outline:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: var(--brand-glow)
        }

        .btn-ghost {
            background: var(--bg-subtle);
            color: var(--ink-2);
            border: 1.5px solid var(--line)
        }

        .btn-ghost:hover {
            background: var(--bg-muted);
            border-color: var(--line-mid)
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: .8rem
        }

        .btn-full {
            width: 100%;
            justify-content: center
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TOPBAR
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .topbar {
            background: var(--ink);
            padding: 7px 0;
            font-size: .75rem
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap
        }

        .topbar a,
        .topbar span {
            color: rgba(255, 255, 255, .7)
        }

        .topbar a:hover {
            color: var(--brand-amber)
        }

        .topbar-left,
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px
        }

        .topbar-icon {
            margin-right: 4px;
            opacity: .7
        }

        .lang-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, .2);
            color: rgba(255, 255, 255, .7);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: .72rem;
            cursor: pointer;
            transition: all var(--t)
        }

        .lang-btn:hover,
        .lang-btn.active {
            border-color: var(--brand-amber);
            color: var(--brand-amber)
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NAVBAR
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .nav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 900;
            box-shadow: 0 2px 20px rgba(28, 16, 9, .05)
        }

        .nav-inner {
            display: flex;
            align-items: center;
            gap: 20px;
            height: 64px
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0
        }

        .nav-logo-mark {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1.5px solid var(--line)
        }
        .nav-logo-mark img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .nav-brand-text {
            font-family: var(--display);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.2
        }

        .nav-brand-text small {
            display: block;
            font-size: .65rem;
            font-weight: 400;
            font-family: var(--body);
            color: var(--ink-3);
            letter-spacing: .03em
        }

        /* Search */
        .nav-search {
            flex: 1;
            max-width: 300px;
            position: relative
        }

        .nav-search-input {
            width: 100%;
            background: var(--bg-subtle);
            border: 1.5px solid var(--line);
            border-radius: 50px;
            padding: 8px 14px 8px 36px;
            font-size: .85rem;
            color: var(--ink-2);
            transition: all var(--t)
        }

        .nav-search-input:focus {
            outline: none;
            border-color: var(--brand);
            background: #fff;
            box-shadow: 0 0 0 3px var(--brand-glow)
        }

        .nav-search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-3);
            pointer-events: none
        }

        /* Links */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: auto
        }

        .nav-link {
            padding: 7px 12px;
            border-radius: var(--r-sm);
            font-size: .88rem;
            font-weight: 500;
            color: var(--ink-2);
            transition: all var(--t)
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--brand);
            background: var(--brand-glow)
        }

        /* Nav actions */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0
        }

        .nav-icon-btn {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: var(--r-sm);
            background: var(--bg-subtle);
            border: 1.5px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-2);
            transition: all var(--t);
            cursor: pointer
        }

        .nav-icon-btn:hover {
            background: var(--brand-glow);
            border-color: var(--brand);
            color: var(--brand)
        }

        .nav-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--brand);
            color: #fff;
            font-size: .6rem;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 2px solid var(--bg-card)
        }

        /* Auth nav buttons */
        .nav-auth {
            display: flex;
            align-items: center;
            gap: 8px
        }

        /* Hamburger */
        .nav-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            border-radius: var(--r-sm);
            border: 1.5px solid var(--line);
            background: var(--bg-subtle)
        }

        .nav-toggle span {
            display: block;
            width: 18px;
            height: 2px;
            background: var(--ink-2);
            border-radius: 2px;
            transition: all var(--t)
        }

        .nav-toggle.open span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px)
        }

        .nav-toggle.open span:nth-child(2) {
            opacity: 0
        }

        .nav-toggle.open span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px)
        }

        /* User dropdown */
        .user-menu {
            position: relative
        }

        .user-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            border-radius: var(--r-sm);
            border: 1.5px solid var(--line);
            background: var(--bg-subtle);
            transition: all var(--t);
            cursor: pointer
        }

        .user-btn:hover {
            border-color: var(--brand);
            background: var(--brand-glow)
        }

        .user-avatar-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: .78rem;
            font-weight: 700;
            overflow: hidden;
            flex-shrink: 0
        }

        .user-avatar-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%
        }

        .user-btn-name {
            font-size: .82rem;
            font-weight: 600;
            color: var(--ink);
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .user-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 240px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            box-shadow: var(--sh-modal);
            z-index: 950;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all .18s var(--ease);
            pointer-events: none
        }

        .user-dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto
        }

        .ud-header {
            padding: 16px;
            border-bottom: 1px solid var(--line)
        }

        .ud-name {
            font-weight: 700;
            color: var(--ink);
            font-size: .9rem
        }

        .ud-email {
            font-size: .78rem;
            color: var(--ink-3);
            margin-top: 2px
        }

        .ud-body {
            padding: 8px
        }

        .ud-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--r-sm);
            color: var(--ink-2);
            font-size: .86rem;
            font-weight: 500;
            transition: all var(--t);
            width: 100%;
            text-align: left;
            cursor: pointer
        }

        .ud-item:hover {
            background: var(--bg-subtle);
            color: var(--brand)
        }

        .ud-item svg {
            width: 16px;
            height: 16px;
            opacity: .6
        }

        .ud-divider {
            height: 1px;
            background: var(--line);
            margin: 4px 8px
        }

        .ud-logout {
            color: #e53e3e !important
        }

        .ud-logout:hover {
            background: #fff5f5 !important
        }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(28, 16, 9, .6);
            backdrop-filter: blur(4px);
            z-index: 1050;
            opacity: 0;
            visibility: hidden;
            transition: all var(--t);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--r-lg);
            box-shadow: var(--sh-modal);
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(.95);
            transition: transform var(--t) var(--ease)
        }

        .modal-overlay.open .modal {
            transform: scale(1)
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid var(--line)
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--ink)
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-2);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all var(--t)
        }

        .modal-close:hover {
            background: var(--brand-glow);
            color: var(--brand)
        }

        .modal-body {
            padding: 20px
        }

        .form-group {
            margin-bottom: 16px
        }

        .form-label {
            display: block;
            font-size: .85rem;
            font-weight: 600;
            color: var(--ink-2);
            margin-bottom: 6px
        }

        .form-input {
            width: 100%;
            background: var(--bg-subtle);
            border: 1.5px solid var(--line);
            border-radius: var(--r-md);
            padding: 10px 12px;
            font-size: .9rem;
            color: var(--ink);
            transition: all var(--t)
        }

        .form-input:focus {
            outline: none;
            border-color: var(--brand);
            background: #fff;
            box-shadow: 0 0 0 3px var(--brand-glow)
        }

        .form-input:read-only {
            background: var(--bg-muted);
            cursor: not-allowed;
            opacity: .7
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px
        }

        @media(max-width:1024px) {

            .nav-links,
            .nav-search {
                display: none
            }

            .nav-toggle {
                display: flex
            }
        }

        @media(max-width:640px) {
            .nav-auth .btn:first-child {
                display: none
            }
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MOBILE DRAWER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(28, 16, 9, .5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--t)
        }

        .drawer-overlay.open {
            opacity: 1;
            visibility: visible
        }

        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: min(320px, 90vw);
            background: var(--bg-card);
            z-index: 1001;
            transform: translateX(-100%);
            transition: transform .3s var(--ease);
            overflow-y: auto;
            display: flex;
            flex-direction: column
        }

        .drawer.open {
            transform: translateX(0)
        }

        .drawer-head {
            display: flex;

    <script>
        // ═══════════════════════════════════════════════════════════════
        // INTERNATIONALIZATION (i18n)
        // ═════════════════════════════════════════════════���═════════════
        const translations = {
            en: {
                call_us: 'Call us',
                work_hours: 'Mon–Sat | 8AM–6PM',
                search_placeholder: 'Search products...',
                home: 'Home',
                products: 'Products',
                about: 'About',
                contact: 'Contact',
                pricing: 'Pricing',
                gallery: 'Gallery',
                profile: 'Profile',
                view_profile: 'View Profile',
                edit_profile: 'Edit Profile',
                edit_profile_title: 'Edit Profile',
                settings: 'Settings',
                logout: 'Logout',
                menu: 'Menu',
                sign_in: 'Sign In',
                sign_up: 'Sign Up',
                user_profile: 'User Profile',
                name: 'Name',
                email: 'Email',
                phone: 'Phone',
                location: 'Location',
                joined: 'Joined',
                cancel: 'Cancel',
                save: 'Save Changes',
                welcome: 'Welcome',
                iso_certified: 'ISO Certified',
                quality_assured: 'Quality Assured',
                since: 'Since'
            },
            hi: {
                call_us: 'हमें कॉल करें',
                work_hours: 'सोम–शनि | 8AM–6PM',
                search_placeholder: 'उत्पाद खोजें...',
                home: 'होम',
                products: 'उत्पाद',
                about: 'हमारे बारे में',
                contact: 'संपर्क करें',
                pricing: 'मूल्य निर्धारण',
                gallery: 'गैलरी',
                profile: 'प्रोफाइल',
                view_profile: 'प्रोफाइल देखें',
                edit_profile: 'प्रोफाइल संपादित करें',
                edit_profile_title: 'प्रोफाइल संपादित करें',
                settings: 'सेटिंग्स',
                logout: 'लॉग आउट करें',
                menu: 'मेनू',
                sign_in: 'साइन इन करें',
                sign_up: 'साइन अप करें',
                user_profile: 'उपयोगकर्ता प्रोफाइल',
                name: 'नाम',
                email: 'ईमेल',
                phone: 'फोन',
                location: 'स्थान',
                joined: 'शामिल हुए',
                cancel: 'रद्द करें',
                save: 'परिवर्तन सहेजें',
                welcome: 'स्वागत है',
                iso_certified: 'ISO प्रमाणित',
                quality_assured: 'गुणवत्ता आश्वस्त',
                since: 'के बाद से'
            }
        };

        let currentLanguage = localStorage.getItem('language') || 'en';

        // ═══════════════════════════════════════════════════════════════
        // LANGUAGE SWITCHER - FIXED FUNCTION NAME
        // ═══════════════════════════════════════════════════════════════
        function setLang(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);

            // Update all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            // Update lang button active states
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');

            // Update document language
            document.documentElement.lang = lang;
        }

        // ═══════════════════════════════════════════════════════════════
        // USER MENU & PROFILE MODALS - FIXED
        // ═══════════════════════════════════════════════════════════════
        const userMenuBtn = document.getElementById('userMenuBtn');
        const userDropdown = document.getElementById('userDropdown');
        const viewProfileBtn = document.getElementById('viewProfileBtn');
        const editProfileBtn = document.getElementById('editProfileBtn');

        // Toggle user dropdown
        userMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdown.classList.toggle('open');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (userMenuBtn && userDropdown && !userMenuBtn.contains(e.target) && !userDropdown.contains(e.target)) {
                userDropdown.classList.remove('open');
            }
        });

        // Profile modal elements
        const profileModal = document.getElementById('profileModal');
        const editProfileModal = document.getElementById('editProfileModal');
        const closeProfileModal = document.getElementById('closeProfileModal');
        const closeEditModal = document.getElementById('closeEditModal');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const saveProfileBtn = document.getElementById('saveProfileBtn');

        // View profile - open profile modal
        if (viewProfileBtn) {
            viewProfileBtn.addEventListener('click', () => {
                userDropdown.classList.remove('open');
                profileModal.classList.add('open');
            });
        }

        // Edit profile - switch from profile modal to edit modal
        if (editProfileBtn) {
            editProfileBtn.addEventListener('click', () => {
                userDropdown.classList.remove('open');
                profileModal.classList.remove('open');
                editProfileModal.classList.add('open');
            });
        }

        // Close profile modal
        if (closeProfileModal) {
            closeProfileModal.addEventListener('click', () => {
                profileModal.classList.remove('open');
            });
        }

        // Close edit modal
        if (closeEditModal) {
            closeEditModal.addEventListener('click', () => {
                editProfileModal.classList.remove('open');
            });
        }

        // Cancel edit
        if (cancelEditBtn) {
            cancelEditBtn.addEventListener('click', () => {
                editProfileModal.classList.remove('open');
            });
        }

        // Save profile changes
        if (saveProfileBtn) {
            saveProfileBtn.addEventListener('click', () => {
                const name = document.getElementById('editName').value;
                const email = document.getElementById('editEmail').value;
                const phone = document.getElementById('editPhone').value;
                const location = document.getElementById('editLocation').value;

                // Update user button name
                const userBtnName = document.querySelector('.user-btn-name');
                if (userBtnName) {
                    userBtnName.textContent = name.split(' ')[0];
                }

                // Close modal
                editProfileModal.classList.remove('open');

                // Show success message
                alert('Profile updated successfully!');
            });
        }

        // Close profile modal on overlay click
        if (profileModal) {
            profileModal.addEventListener('click', (e) => {
                if (e.target === profileModal) {
                    profileModal.classList.remove('open');
                }
            });
        }

        // Close edit modal on overlay click
        if (editProfileModal) {
            editProfileModal.addEventListener('click', (e) => {
                if (e.target === editProfileModal) {
                    editProfileModal.classList.remove('open');
                }
            });
        }

        // ═══════════════════════════════════════════════════════════════
        // MOBILE DRAWER
        // ═══════════════════════════════════════════════════════════════
        const navToggle = document.getElementById('navToggle');
        const drawer = document.getElementById('drawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const drawerClose = document.getElementById('drawerClose');

        if (navToggle) {
            navToggle.addEventListener('click', () => {
                navToggle.classList.add('open');
                drawer.classList.add('open');
                drawerOverlay.classList.add('open');
            });
        }

        if (drawerClose) {
            drawerClose.addEventListener('click', () => {
                navToggle.classList.remove('open');
                drawer.classList.remove('open');
                drawerOverlay.classList.remove('open');
            });
        }

        if (drawerOverlay) {
            drawerOverlay.addEventListener('click', () => {
                navToggle.classList.remove('open');
                drawer.classList.remove('open');
                drawerOverlay.classList.remove('open');
            });
        }

        // ═══════════════════════════════════════════════════════════════
        // LANGUAGE SWITCHER EVENT LISTENERS - FIXED
        // ═══════════════════════════════════════════════════════════════
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.getAttribute('data-lang');
                setLang(lang);
            });
        });

        // ═══════════════════════════════════════════════════════════════
        // SCROLL PROGRESS BAR
        // ═══════════════════════════════════════════════════════════════
        const spbar = document.getElementById('spbar');
        if (spbar) {
            window.addEventListener('scroll', () => {
                const scrollPercent = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
                spbar.style.width = scrollPercent + '%';
            });
        }

        // ═══════════════════════════════════════════════════════════════
        // INITIALIZE
        // ═══════════════════════════════════════════════════════════════
        setLang(currentLanguage);
    </script>
</body>
