<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#A93226">
    <title>Offline — Gurukripa Bricks Industry</title>
    <link rel="stylesheet" href="./src/assets/fonts/offline-fonts.css">
    <style>
        :root {
            --brand: #A93226;
            --brand-dark: #7B241C;
            --bg: #FAF6F2;
            --ink: #252525;
            --ink-3: #6B7280;
            --card: #fff;
            --line: #E5E1DC;
            --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
            --display: Georgia, 'Times New Roman', serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            font-family: var(--body);
            background: var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        }
        .card {
            width: min(440px, 100%);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 28px 22px;
            box-shadow: 0 12px 40px rgba(37, 37, 37, 0.08);
            text-align: center;
        }
        .logo {
            width: 64px; height: 64px; border-radius: 12px; object-fit: cover;
            margin: 0 auto 14px; display: block;
        }
        h1 {
            font-family: var(--display);
            font-size: 1.45rem;
            margin: 0 0 8px;
            color: var(--brand-dark);
        }
        p { margin: 0 0 12px; color: var(--ink-3); line-height: 1.55; font-size: 0.95rem; }
        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 46px; padding: 10px 16px; border-radius: 10px;
            font-weight: 700; font-size: 0.95rem; text-decoration: none; border: none; cursor: pointer;
            font-family: inherit;
        }
        .btn-primary { background: var(--brand); color: #fff; }
        .btn-outline { background: transparent; color: var(--brand-dark); border: 1.5px solid var(--line); }
        .btn-wa { background: #16a34a; color: #fff; }
        .hint { font-size: 0.78rem; margin-top: 14px; }
    </style>
</head>
<body>
    <main class="card" role="main">
        <img class="logo" src="./src/assets/images/gurukripaLogo.jpg" alt="Gurukripa Bricks Industry" width="64" height="64">
        <h1>You're offline</h1>
        <p>The yard app shell could not be reached. Saved prices and the estimator still work once the main page is cached from a previous visit.</p>
        <div class="actions">
            <button type="button" class="btn btn-primary" onclick="location.reload()">Try again</button>
            <a class="btn btn-wa" href="https://wa.me/919198923230?text=Namaste%20Gurukripa%20Bricks%20—%20I%20need%20help%20while%20offline.">WhatsApp the yard</a>
            <a class="btn btn-outline" href="tel:+919198923230">Call +91 91989 23230</a>
            <a class="btn btn-outline" href="./index.html">Open saved home</a>
        </div>
        <p class="hint">Jalalpur–Chavri Road, Jaunpur (UP) · Mon–Sat 8AM–6PM</p>
    </main>
</body>
</html>
