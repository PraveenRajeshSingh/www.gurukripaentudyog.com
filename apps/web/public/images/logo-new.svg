<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Gurukripa Ent Udyog">
  <defs>
    <linearGradient id="ge-bg" x1="12%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#E05A1C"/>
      <stop offset="50%" stop-color="#C8460A"/>
      <stop offset="100%" stop-color="#7A2804"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#ge-bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- GE monogram -->
  <text x="64" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="-1">GE</text>

  <!-- Brick row under monogram -->
  <g fill="#F5A623">
    <rect x="34" y="86" width="18" height="8" rx="1.5"/>
    <rect x="55" y="86" width="18" height="8" rx="1.5"/>
    <rect x="76" y="86" width="18" height="8" rx="1.5"/>
  </g>
  <g fill="#FFD56A" opacity="0.95">
    <rect x="44" y="97" width="18" height="8" rx="1.5"/>
    <rect x="66" y="97" width="18" height="8" rx="1.5"/>
  </g>
</svg>
