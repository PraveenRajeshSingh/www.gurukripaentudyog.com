<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        // SPA redirect hack for static hosting (GitHub Pages & Custom Domain robust)
        (function () {
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            var repoName = '/www.gurukripaentudyog.com';
            var isGitHubPages = path.startsWith(repoName);

            var rootPath = isGitHubPages ? repoName + '/' : '/';
            var indexPath = isGitHubPages ? repoName + '/index.html' : '/index.html';

            // If the path is not root, store it and redirect
            if (path && path !== rootPath && path !== indexPath) {
                localStorage.setItem('spa_redirect', JSON.stringify({
                    path: path,
                    search: search,
                    hash: hash
                }));
                window.location.href = rootPath;
            }
        })();
    </script>

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #b83a14 0%, #8c2409 100%);
            padding: 20px;
            text-align: center;
            color: white;
        }

        .error-container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            color: #333;
        }

        .error-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #b83a14;
            animation: pulse 2s infinite;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            margin: 0;
            color: #b83a14;
            line-height: 1;
        }

        .error-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 20px 0;
            color: #2C3E50;
        }

        .error-message {
            font-size: 1.2rem;
            margin: 20px 0 30px;
            color: #666;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .error-btn {
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-home {
            background: linear-gradient(135deg, #b83a14, #8c2409);
            color: white;
            box-shadow: 0 4px 15px rgba(184, 58, 20, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(184, 58, 20, 0.4);
        }

        .btn-contact {
            background: white;
            color: #b83a14;
            border: 2px solid #b83a14;
        }

        .btn-contact:hover {
            background: #b83a14;
            color: white;
            transform: translateY(-3px);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .btn-products {
            background: linear-gradient(135deg, #27ae60, #219653);
            color: white;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }

        .btn-products:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.4);
        }

        .error-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
            color: #999;
        }

        @media (max-width: 768px) {
            .error-container {
                padding: 30px 20px;
            }

            .error-code {
                font-size: 4rem;
            }

            .error-title {
                font-size: 2rem;
            }

            .error-actions {
                flex-direction: column;
                align-items: center;
            }

            .error-btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }

    </div>

    <script>
        // Track 404 errors for analytics
        if ('gtag' in window) {
            gtag('event', '404_error', {
                'page_location': document.referrer,
                'page_title': '404 Page Not Found'
            });
        }

        // Add smooth transition
        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.5s ease';

        window.addEventListener('load', function () {
            document.body.style.opacity = '1';
        });
    </script>
