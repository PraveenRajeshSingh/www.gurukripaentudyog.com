name: Web CI

# Continuous-integration only. This workflow VALIDATES every push/PR to main.
# The production site is deployed by "Deploy to GitHub Pages" (deploy.yml),
# which is the single deployment target for this project. Vercel is NOT a
# production host, so there is no Vercel deploy job here (kept deliberately
# to avoid two conflicting production deployment processes).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build Web Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared API Contracts
        run: npm run build:contracts

      - name: Test Shared API Contracts
        run: npm run test:contracts

      - name: Test Web Routes & Components
        run: npm run test:web

      - name: Run Legacy Production Regression Suite
        run: npm test

      - name: Assemble Legacy Static Site (GitHub Pages artifact source)
        # deploy.yml publishes www/; verify it builds here so CI catches breakage.
        run: npm run www

      - name: Build Next.js Production Bundle
        run: npm run build:web
