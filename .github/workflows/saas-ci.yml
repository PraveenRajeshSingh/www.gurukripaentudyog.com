name: CI/CD Pipeline - Brick Supply Multi-Tenant SaaS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-build:
    name: Backend Build & Tenant Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

      - name: Build Backend Artifact
        run: |
          cd backend
          npm run build

  flutter-app-build:
    name: Flutter Cross-Platform App Build (Android/iOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd flutter_app
          flutter analyze --no-fatal-infos

      - name: Build Android App Bundle (AAB)
        run: |
          cd flutter_app
          flutter build appbundle --release --no-pub
