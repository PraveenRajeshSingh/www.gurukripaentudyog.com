name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit:
    name: npm audit (root + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root workspaces
        run: npm ci
      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  secret-patterns:
    name: Block obvious committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked source for private keys / live gateway secrets
        run: |
          set -euo pipefail
          node scripts/run-secret-scan.js
      - name: Production env validator dry-run (must skip / fail closed)
        run: |
          set -euo pipefail
          node scripts/validate-production-env.js
          if NODE_ENV=production node scripts/validate-production-env.js; then
            echo "::error::Validator must fail when production secrets are unset"
            exit 1
          fi
          echo "validate-production-env fails closed without secrets (expected)."
